[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-interview-coach"
version = "0.1.0"
description = "A role-specific voice interview practice coach built with LiveKit Agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "livekit-agents[openai,silero]>=1.3.3,<2",
    "python-dotenv>=1.0",
]

[project.scripts]
voice-interview-coach = "interview_coach.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_coach"]
